[package]
name = "qjs-runner"
version = "0.1.0"
description = "QuickJS sidecar for TVBox desktop JS spiders (spec 7.3 / T-16)"
edition = "2021"

[[bin]]
name = "qjs-runner"
path = "src/main.rs"

[dependencies]
rquickjs = { version = "0.9", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
