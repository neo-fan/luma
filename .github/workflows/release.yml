name: release

# 打 tag（v*）时构建 NSIS 安装器并发布到 GitHub Release；也可手动触发补发。
# 链路与 docs/RELEASING.md §2.3 一致：先 prepare_runtime.py 准备随包运行时，
# 再交给官方 `tauri build` 出包（bundle.targets 固定为 nsis）。
# 产物：src-tauri/target/release/bundle/nsis/Luma_<version>_x64-setup.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（留空则用 package.json 版本，自动加 v 前缀）"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: windows nsis + github release
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # runner 默认控制台代码页是 cp1252，脚本里的中文输出会直接 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            sidecars/qjs-runner -> target

      - name: Resolve release tag
        shell: pwsh
        # tag 必须与 package.json 版本一致，避免装出与 Release 对不上的包。
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "v" + $pkg.version }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "tag $($env:GITHUB_REF_NAME) 与 package.json 版本 $($pkg.version) 不一致"
          }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "release tag: $tag"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build qjs-runner sidecar
        # prepare_runtime.py 只做 staging，不负责编译 sidecar
        run: cargo build --release --manifest-path sidecars/qjs-runner/Cargo.toml

      - name: Prepare bundled runtime
        run: python tools/prepare_runtime.py

      - name: Build installer
        # tauri build 自带 beforeBuildCommand（corepack pnpm build）
        run: corepack pnpm build:app

      - name: Generate update manifest
        shell: pwsh
        # 客户端不调 GitHub API（加速前缀不支持 api.github.com），只读这个静态
        # 清单。字段与 src-tauri/src/domain/updater.rs 的 Manifest 一一对应。
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $exe = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw '找不到 NSIS 安装包' }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()

          # 版本说明取 CHANGELOG 里本版本段落；没有就留空，客户端只隐藏说明区。
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = '(?ms)^##\s*\[?' + [regex]::Escape($pkg.version) + '\]?.*?$\r?\n?(.*?)(?=^##\s|\z)'
          $match = [regex]::Match($changelog, $pattern)
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { '' }

          $manifest = [ordered]@{
            version = $pkg.version
            tag     = $env:TAG
            notes   = $notes
            pubDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            asset   = [ordered]@{
              name   = $exe.Name
              size   = $exe.Length
              sha256 = $sha
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          # serde_json 不接受 BOM：显式写 UTF-8 无 BOM。
          $path = 'src-tauri/target/release/bundle/nsis/latest.json'
          [System.IO.File]::WriteAllText($path, $json, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $path

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
