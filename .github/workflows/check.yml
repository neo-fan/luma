name: regression

# Offline regression on a clean runner. Mirrors the local gate (`python tools/check.py`)
# split into three jobs, because two of its checks need things a fresh checkout does
# not have:
#   - py adapter checks need pip deps (lxml / pyquery / pycryptodome)
#   - rust tests need `dist/` and the `bundle.resources` paths (jre / python-embed)
# Window probes (tools/run_probes.mjs) are NOT covered here: they need a debug window
# with CDP 9222. They stay in the manual pre-release checklist (docs/RELEASING.md §2.2).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: offline gate (contract + syntax + vitest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Contract + python syntax + frontend unit tests
        run: python tools/check.py --ci

  rust:
    name: rust unit tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend (embedded by tauri::generate_context!)
        run: pnpm build
      - name: Stub bundled runtime artifacts
        shell: pwsh
        # tauri-build copies `bundle.resources` / `bundle.externalBin` into the target
        # dir on every build and hard-fails on a missing path. The real jre /
        # python-embed / qjs-runner binaries are gitignored local artifacts rebuilt by
        # tools/prepare_runtime.py, so CI supplies empty stand-ins: enough to compile,
        # and the unit tests never spawn a sidecar.
        run: |
          New-Item -ItemType Directory -Force sidecars/jre, sidecars/python-embed | Out-Null
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Set-Content -NoNewline -Path src-tauri/binaries/qjs-runner-x86_64-pc-windows-msvc.exe -Value ""
      - name: cargo test --lib
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  py-adapter:
    name: python adapter compatibility
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install adapter dependencies (same pins as the bundled runtime)
        run: python -m pip install --disable-pip-version-check -r tools/python-requirements.txt
      - name: TVBox py spider compatibility
        run: python tests/offline/py_compat_check.py
      - name: py base spider framework alignment
        run: python tests/offline/py_base_spider_check.py
