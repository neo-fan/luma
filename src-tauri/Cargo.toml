[package]
name = "tvbox-desktop"
version = "0.1.0"
description = "TVBox desktop shell (config-compatible player framework)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tvbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# T-01 只锁最小依赖；reqwest / axum / tokio / windows(JobObjects) 在 T-05 起的任务里按需加入。
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
