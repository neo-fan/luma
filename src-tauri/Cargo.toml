[package]
name = "luma"
version = "1.0.0-alpha"
description = "Luma - TVBox-compatible desktop player framework"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Single-file persistence for configs / favourites / history. `bundled` compiles
# the SQLite amalgamation into the binary so portable builds need no system DLL.
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
# File + stdout logging for the trial run. `fmt` + `registry` let us tee the
# same event stream to two layers; `env-filter` is deliberately omitted so the
# dependency tree stays small (level comes from LUMA_LOG instead).
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "registry",
    "ansi",
    "std",
    "smallvec",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
url = "2"
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
] }
# T-29: the level-4 sniffer reads the WebView2 controller to observe network
# requests. webview2-com 0.39 links windows 0.62, so alias that version instead
# of forcing the Job Object code (windows 0.58) to migrate.
webview2-com = "0.39"
windows062 = { package = "windows", version = "0.62", features = ["Win32_Foundation"] }
