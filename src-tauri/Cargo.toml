[package]
name = "luma"
version = "1.0.4"
description = "Luma - TVBox-compatible desktop player framework"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "luma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Single-file persistence for configs / favourites / history. `bundled` compiles
# the SQLite amalgamation into the binary so portable builds need no system DLL.
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
# File + stdout logging for the trial run. `fmt` + `registry` let us tee the
# same event stream to two layers and `env-filter` gives `LUMA_LOG` the usual
# `target=level,...` syntax; the rolling file writer itself comes from
# `tracing-appender` (daily rotation, pruned to the last 7 files by us).
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "registry",
    "ansi",
    "std",
    "smallvec",
    "env-filter",
] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 外部字节不保证 UTF-8（中文圈配置大量是 GBK/GB18030，论坛复制的片段常带
# BOM 或 UTF-16）。`charset` 特性会把解码塞进 reqwest 内部且只认 Content-Type，
# 这里自己收字节再按 BOM → UTF-8 → 声明 → GB18030 的顺序洗，规则集中在
# `infra/textio.rs`，测试也一起放在那里。
encoding_rs = "0.8"
# 配置快照 id = sha1(origin)[..12]，与旧 Python 适配层一致（换算法会让所有
# 已导入配置换 id，收藏与历史全部对不上）。
sha1 = "0.10"
base64 = "0.22"
flate2 = "1"
# importedAt 用 RFC3339；只借用来格式化，不碰时区数据库。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 直播源解析（M3U 属性、XMLTV 时间）在进程内做，sidecar 只留给第三方源脚本。
# `quick-xml` 用 stream 模式：EPG 动辄几十 MB、覆盖 9 天，建树会白吃几十 MB 内存。
regex = "1"
quick-xml = { version = "0.37", features = ["escape-html"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
url = "2"
async-trait = "0.1"
# 分片伪装剥离要「回放头部 + 续流」，用最小 features 的 stream 组合子。
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
] }
# T-29: the level-4 sniffer reads the WebView2 controller to observe network
# requests. webview2-com 0.39 links windows 0.62, so alias that version instead
# of forcing the Job Object code (windows 0.58) to migrate.
webview2-com = "0.39"
windows062 = { package = "windows", version = "0.62", features = ["Win32_Foundation"] }

# Official Tauri profile guidance (https://v2.tauri.app/concept/size/#cargo-configuration).
# Keep these in sync with upstream: `tauri dev` builds the dev profile, `tauri build`
# builds the release profile. Do not add project-specific tweaks here — anything we
# need beyond this belongs in tauri.conf.json.
[profile.dev]
incremental = true          # Compile the binary in smaller steps.

[profile.release]
codegen-units = 1           # Better LLVM optimization.
lto = true                  # Link-time optimization.
opt-level = "s"             # Size first; use 3 if runtime speed ever regresses.
panic = "abort"             # Drop panic unwinding.
strip = true                # Strip symbols.
